version: '3.8'

services:
  init:
    image: alpine:3.21
    user: "0:0"
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /appdata/wwebjs_auth /appdata/uploads /appdata/reports
        chown -R 1000:1000 /appdata/wwebjs_auth /appdata/uploads /appdata/reports
        chmod 0755 /appdata/wwebjs_auth /appdata/uploads /appdata/reports
    volumes:
      - ${APP_DATA_DIR}:/appdata

  whatsapplist:
    image: pasmer/whatsapplist:1.1.0
    container_name: whatsapplist
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "7676:7676"
    volumes:
      # Persistenza sessione WhatsApp
      - ${APP_DATA_DIR}/wwebjs_auth:/app/.wwebjs_auth
      # Persistenza dei CSV caricati e immagini campagna
      - ${APP_DATA_DIR}/uploads:/app/uploads
      # Persistenza dei report CSV di invio falliti
      - ${APP_DATA_DIR}/reports:/app/reports
    environment:
      - NODE_ENV=production
      - PORT=7676
      # Configurazione Puppeteer (usa Chromium di sistema)
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    # Shared memory necessaria per Chromium (evita crash)
    shm_size: '2gb'
    # Healthcheck per verificare lo stato del container
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7676/api/status', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - umbrel_main_network

networks:
  umbrel_main_network:
    external: true
